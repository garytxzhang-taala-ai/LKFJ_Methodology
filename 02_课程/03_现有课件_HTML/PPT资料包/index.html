<body data-page="index">
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">LKFJ｜六块腹肌共同能力底座</p>
      <h1>课程 PPT 资料包</h1>
      <p>以 G0-1、G1-1、A1-1 等能力模块为最小单位。G/A/P 是课程实施结构，服务于专注、理解、判断、表达、主见与创造；先确定“教什么”，再把模块组合成 40 分钟的 L 课时。</p>
    </header>
    <section class="notice">
      <strong>两种实施方式</strong>：AI 营按“认知与边界 → 工具地图 → 兴趣／问题 → 最小 Demo → 测试与展示”完成第一次项目闭环；一对一先形成兴趣证据与项目建议卡，再按项目缺口组合模块。<br><br>
      <strong>使用方式</strong>：每个模块页面都有建议课堂时间、建议 L 组合、每节 L 的 PPT 结构、案例、活动、讲师提示和作业。时间不含访谈、制作、用户测试等课后实践。
    </section>
    <div id="package-list"></div>
  </main>
  <script src="assets/curriculum.js"></script>
  <script src="assets/advanced-curriculum.js"></script>
